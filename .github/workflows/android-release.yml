name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle önbelleğini hazırla
        uses: gradle/actions/setup-gradle@v4

      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret tanımlı değil"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/yakitrotam-release.keystore

      - name: Google Places anahtarını hazırla
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > local.properties

      - name: Testleri çalıştır ve APK oluştur
        env:
          RELEASE_STORE_FILE: yakitrotam-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: APK dosyasını adlandır
        run: cp app/build/outputs/apk/release/app-release.apk "YakitRotam-v1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Build çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: YakitRotam-v1.0.${{ github.run_number }}
          path: YakitRotam-v1.0.${{ github.run_number }}.apk
          retention-days: 30

      - name: GitHub Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "YakitRotam-v1.0.${GITHUB_RUN_NUMBER}.apk#YakıtRotam APK" \
            --target "$GITHUB_SHA" \
            --title "YakıtRotam v1.0.${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --latest
