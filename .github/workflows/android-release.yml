name: Android APK

on:
  push:
    branches: [main]
    # Yalnızca belge değişen push'lar aynı APK'nın kopyası bir release üretmesin.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle önbelleğini hazırla
        uses: gradle/actions/setup-gradle@v5

      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret tanımlı değil"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/yakitrotam-release.keystore

      - name: Testleri çalıştır, APK ve Play Store paketi (AAB) oluştur
        env:
          RELEASE_STORE_FILE: yakitrotam-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Tanımlı değilse release build Google'ın test reklam kimlikleriyle çıkar.
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Çıktıları adlandır
        run: |
          cp app/build/outputs/apk/release/app-release.apk "YakitRotam-v1.0.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "YakitRotam-v1.0.${GITHUB_RUN_NUMBER}.aab"

      # AAB yalnızca Actions artifact'ı olarak saklanır, Release'e eklenmez:
      # Obtainium gibi araçlar yanlışlıkla .aab dosyasını indirmeye çalışmasın.
      - name: Build çıktısını sakla
        uses: actions/upload-artifact@v4
        with:
          name: YakitRotam-v1.0.${{ github.run_number }}
          path: |
            YakitRotam-v1.0.${{ github.run_number }}.apk
            YakitRotam-v1.0.${{ github.run_number }}.aab
          retention-days: 30

      - name: GitHub Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "YakitRotam-v1.0.${GITHUB_RUN_NUMBER}.apk#YakıtRotam APK" \
            --target "$GITHUB_SHA" \
            --title "YakıtRotam v1.0.${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --latest
